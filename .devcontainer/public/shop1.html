<body>

    <table>

                <th scope="col">Unit Price</th>

        <tbody>
            <tr>
                <td>Apples</td>
                <td>0.33</td>
                <td>6</td>
            </tr>
            <tr>
                <td>Bunch of grapes</td>

        </tbody>
        <tfoot>
            <tr>
                <td rowspan="1">Total</td>
                <td rowspan="2"> --</td>
